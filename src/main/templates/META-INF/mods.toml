# Forge 1.20.1 mods.toml (filled in by generateModMetadata from the gradle properties)
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies."${mod_id}"]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="ae2"
    mandatory=true
    versionRange="[15.4,16)"
    ordering="AFTER"
    side="BOTH"

# twinstar_core: a Lumina base layer this mod is built on; Forge loads it first
[[dependencies."${mod_id}"]]
    modId="twinstar_core"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# twinstar_ae2: the AE2 side of the engine this mod is built on; Forge loads it first
[[dependencies."${mod_id}"]]
    modId="twinstar_ae2"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# twinstar_api: a Lumina base layer this mod is built on; Forge loads it first
[[dependencies."${mod_id}"]]
    modId="twinstar_api"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
