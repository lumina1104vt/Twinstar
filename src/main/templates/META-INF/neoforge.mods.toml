modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="ae2"
    type="required"
    versionRange="[19.2,20)"
    ordering="AFTER"
    side="BOTH"

# the plan screen is built with LDLib2's UI (client only; servers do not need it)
[[dependencies."${mod_id}"]]
    modId="ldlib2"
    type="required"
    versionRange="[2.2.41,)"
    ordering="NONE"
    side="CLIENT"

# twinstar_core: a Lumina base layer this mod is built on; NeoForge loads it first
[[dependencies."${mod_id}"]]
    modId="twinstar_core"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# twinstar_ae2: the AE2 side of the engine this mod is built on; NeoForge loads it first
[[dependencies."${mod_id}"]]
    modId="twinstar_ae2"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# twinstar_api: a Lumina base layer this mod is built on; NeoForge loads it first
[[dependencies."${mod_id}"]]
    modId="twinstar_api"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
